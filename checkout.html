<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="ELORA HOUSE — Made to Be You"><title>Checkout · ELORA HOUSE</title><link rel="stylesheet" href="styles.css"></head><body><div id="site-header"></div>
<main><section class="page-hero"><div class="container"><div class="eyebrow">Dummy checkout</div><h1>Checkout</h1><p>This prototype uses dummy payment and shipping.</p></div></section>
<section class="section"><div class="container" id="checkoutMessage"><form id="checkoutForm" class="cart-layout"><div><div class="notice">No real payment is processed. This checkout is for prototype demonstration only.</div><div class="form-grid"><div class="field"><label>Name</label><input required placeholder="Your name"></div><div class="field"><label>Email</label><input required type="email" placeholder="you@example.com"></div><div class="field"><label>Phone</label><input required placeholder="+62"></div><div class="field"><label>City</label><input required placeholder="Jakarta"></div><div class="field full"><label>Address</label><textarea required placeholder="Your delivery address"></textarea></div><div class="field"><label>Payment</label><select><option>Dummy Payment</option><option>Bank Transfer (Demo)</option><option>Cash on Delivery (Demo)</option></select></div><div class="field"><label>Shipping</label><select><option>Standard Shipping — Rp 25.000</option><option>Express Shipping — Rp 45.000</option></select></div></div><button class="btn" style="margin-top:25px">Place dummy order</button></div><aside class="summary"><h3>Order note</h3><p style="font-size:12px">Your cart items are stored only in this browser using localStorage. No database or real authentication is used.</p></aside></form></div></section></main><div id="site-footer"></div><script src="app.js"></script></body></html>
