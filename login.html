<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="description" content="ELORA HOUSE — Made to Be You" />
    <title>Login · ELORA HOUSE</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="site-header"></div>
    <main class="login-wrap">
      <div class="login-box">
        <div class="eyebrow">ELORA HOUSE</div>
        <h1>Back in Style</h1>
        <p>
          Where every outfit tells your story. Sign in to explore fashion made
          to be you.
        </p>
        <form id="loginForm">
          <div class="field">
            <label>Name</label>
            <input id="loginName" required placeholder="Your name" />
          </div>
          <div class="field">
            <label>Email</label>
            <input type="email" required placeholder="you@example.com" />
          </div>
          <button class="btn" style="width: 100%; margin-top: 8px">
            Continue
          </button>
        </form>
      </div>
    </main>
    <div id="site-footer"></div>
    <script src="app.js"></script>
  </body>
</html>
